<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Landon Lawns LLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #2d5016 0%, #4a7c2c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #2d5016;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        .checkmark {
            font-size: 3rem;
            color: #4a7c2c;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .highlight {
            color: #2d5016;
            font-weight: 600;
        }

        .cta-button {
            display: inline-block;
            background: #4a7c2c;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .cta-button:hover {
            background: #2d5016;
        }

        footer {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .checkmark {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✓</div>
        <h1>Thank You!</h1>
        <p>We've received your quote request and appreciate your interest in <span class="highlight">Landon Lawns LLC</span>.</p>
        <p>We'll review your information and get back to you as soon as possible with a custom quote for your lawn care needs.</p>
        <a href="/" class="cta-button">Back to Home</a>
        <footer>
            <p>&copy; 2026 Landon Lawns LLC</p>
        </footer>
    </div>
</body>
</html>
